<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard IoT + Gemini AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">Panel IoT - Detecciones + IA</h1>
        <p class="text-xs text-slate-400">ESP8266 + Firebase + Google AI Studio</p>
      </div>
      <div id="status-badge" class="px-3 py-1 text-xs rounded-full bg-slate-800 text-slate-400 border border-slate-700">
        Conectando...
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
        <span class="text-slate-400 text-xs font-semibold uppercase">Total de Detecciones</span>
        <div id="total-count" class="text-4xl font-extrabold text-white mt-1">0</div>
      </div>
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
        <span class="text-slate-400 text-xs font-semibold uppercase">Último Evento</span>
        <div id="last-event" class="text-sm font-medium text-emerald-400 mt-2">Esperando datos...</div>
      </div>
    </div>

    <div class="bg-slate-800 p-5 rounded-xl border border-indigo-500/30 space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-lg font-bold text-indigo-400">Análisis Inteligente con Gemini</h2>
          <p class="text-xs text-slate-400">Genera un reporte automático con los eventos de Firebase.</p>
        </div>
        <button id="btn-analyze" onclick="generarReporteIA()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-4 py-2 rounded-lg transition-colors">
          Generar Reporte
        </button>
      </div>

      <div id="ai-output" class="hidden bg-slate-900/80 p-4 rounded-lg border border-slate-700 text-sm text-slate-300 leading-relaxed">
      </div>
    </div>

    <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
      <div class="p-4 border-b border-slate-700 font-semibold text-sm">Historial de Actividad</div>
      <div class="max-h-80 overflow-y-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-800 text-slate-400 text-xs uppercase border-b border-slate-700 sticky top-0">
            <tr>
              <th class="py-3 px-4">ID Sensor</th>
              <th class="py-3 px-4">Evento</th>
              <th class="py-3 px-4">Fecha / Hora</th>
              <th class="py-3 px-4">Clave Registro</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-700">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://chatbot-ug-37ee9-default-rtdb.firebaseio.com"
    };
    const GEMINI_API_KEY = "TU_GEMINI_API_KEY_AQUI";

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const deteccionesRef = database.ref("detecciones");

    let datosGlobales = null;

    deteccionesRef.on("value", (snapshot) => {
      datosGlobales = snapshot.val();
      const tableBody = document.getElementById("table-body");
      const totalCount = document.getElementById("total-count");
      const lastEvent = document.getElementById("last-event");
      const statusBadge = document.getElementById("status-badge");

      statusBadge.textContent = "Conectado";
      statusBadge.className = "px-3 py-1 text-xs rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800";

      if (!datosGlobales) {
        tableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">Sin datos registrados</td></tr>';
        return;
      }

      tableBody.innerHTML = "";
      const entries = Object.entries(datosGlobales).reverse();
      totalCount.textContent = entries.length;

      entries.forEach(([key, val], index) => {
        if (index === 0) {
          lastEvent.textContent = (val.evento || 'Evento') + " - " + (val.fecha_hora || 'Reciente');
        }

        const row = document.createElement("tr");
        row.className = "hover:bg-slate-750 transition-colors";
        row.innerHTML = `
          <td class="py-3 px-4 font-mono text-emerald-300">${val.sensor_id || 'N/A'}</td>
          <td class="py-3 px-4">${val.evento || 'N/A'}</td>
          <td class="py-3 px-4 text-xs font-mono text-indigo-300">${val.fecha_hora || 'Sin fecha'}</td>
          <td class="py-3 px-4 text-xs font-mono text-slate-500">${key}</td>
        `;
        tableBody.appendChild(row);
      });
    });

    async function generarReporteIA() {
      const outputDiv = document.getElementById("ai-output");
      const btn = document.getElementById("btn-analyze");

      if (!datosGlobales) {
        alert("No hay datos en Firebase para analizar.");
        return;
      }

      outputDiv.classList.remove("hidden");
      outputDiv.innerHTML = "<span class='text-indigo-400 animate-pulse'>Gemini está analizando los datos...</span>";
      btn.disabled = true;

      const promptText = "Analiza los siguientes registros IoT de detección de movimiento con fecha y hora provenientes de un ESP8266: " + JSON.stringify(datosGlobales) + ". Dame un informe ejecutivo muy breve en 2 párrafos indicando los horarios de mayor actividad y recomendaciones de seguridad.";

      try {
        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + GEMINI_API_KEY, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          let text = data.candidates[0].content.parts[0].text;
          outputDiv.innerHTML = text.replace(/\n/g, '<br>');
        } else {
          outputDiv.innerHTML = "<span class='text-red-400'>Error al obtener respuesta. Revisa tu API Key de Gemini.</span>";
        }
      } catch (error) {
        outputDiv.innerHTML = "<span class='text-red-400'>Error de conexión con la API.</span>";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
